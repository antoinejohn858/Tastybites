<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasty Bites - Caisse</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #222;
}

header {
  background: #123b2a;
  color: white;
  text-align: center;
  padding: 18px;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 5px 0 0;
}

.container {
  max-width: 600px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

h2 {
  color: #123b2a;
  margin-top: 0;
}

.product {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #ddd;
}

.product:last-child {
  border-bottom: none;
}

.product-name {
  font-weight: bold;
}

.price {
  color: #123b2a;
  font-weight: bold;
}

button {
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
}

.add {
  background: #123b2a;
  color: white;
}

.remove {
  background: #ddd;
  margin-left: 5px;
}

.checkout {
  width: 100%;
  background: #123b2a;
  color: white;
  font-size: 18px;
  padding: 15px;
  margin-top: 15px;
}

.total {
  font-size: 24px;
  font-weight: bold;
  text-align: right;
  margin-top: 15px;
}

.payment {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.receipt {
  display: none;
}

@media print {
  body * {
    visibility: hidden;
  }

  .receipt, .receipt * {
    visibility: visible;
  }

  .receipt {
    display: block;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    padding: 20px;
    font-family: monospace;
  }
}
</style>
</head>
