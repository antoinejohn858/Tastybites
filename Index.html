<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123b2a">
<title>Tasty Bites - Caisse</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f5f4;
 color:#222
}
header{
 background:#123b2a;
 color:white;
 text-align:center;
 padding:18px
}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0}

.container{
 max-width:650px;
 margin:auto;
 padding:15px
}
.card{
 background:white;
 border-radius:14px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 2px 8px #0002
}
h2{
 color:#123b2a;
 margin-top:0
}
.product{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:15px 0;
 border-bottom:1px solid #ddd
}
.product:last-child{border-bottom:none}
.name{font-weight:bold;font-size:17px}
.price{
 color:#123b2a;
 font-weight:bold;
 margin-top:5px
}
.actions{
 display:flex;
 align-items:center;
 gap:7px
}
button{
 border:0;
 border-radius:9px;
 padding:11px 15px;
 font-weight:bold;
 font-size:16px
}
.add{
 background:#123b2a;
 color:white
}
.remove{
 background:#ddd
}
.qty{
 min-width:28px;
 text-align:center;
 font-weight:bold
}
.total{
 display:flex;
 justify-content:space-between;
 font-size:24px;
 font-weight:bold;
 margin-top:18px
}
.payment{
 width:100%;
 padding:13px;
 margin-top:15px;
 border:1px solid #ccc;
 border-radius:9px;
 font-size:16px
}
.mainbtn{
 width:100%;
 margin-top:12px;
 background:#123b2a;
 color:white;
 padding:15px
}
.secondary{
 background:#ddd;
 color:#222
}
.history-item{
 padding:13px 0;
 border-bottom:1px solid #ddd
}
.muted{
 color:#777;
 font-size:14px
}
.receipt{
 display:none
}

@media print{
 body *{visibility:hidden}
 .receipt,.receipt *{visibility:visible}
 .receipt{
  display:block;
  position:absolute;
  left:0;
  top:0;
  width:100%;
  padding:8px;
  font-family:monospace;
  font-size:12px
 }
}
</style>
</head>

<body>

<header>
<h1>Tasty Bites</h1>
<p>Catalpa #6 • Gourdes haïtiennes</p>
</header>

<div class="container">

<section class="card">

<h2>Nouvelle vente</h2>

<div class="product">
<div>
<div class="name">Burger Ti Malice</div>
<div class="price">1 500 G</div>
</div>

<div class="actions">
<button class="remove" onclick="change(0,-1)">−</button>
<span class="qty" id="q0">0</span>
<button class="add" onclick="change(0,1)">+</button>
</div>
</div>


<div class="product">
<div>
<div class="name">Frites</div>
<div class="price">750 G</div>
</div>

<div class="actions">
<button class="remove" onclick="change(1,-1)">−</button>
<span class="qty" id="q1">0</span>
<button class="add" onclick="change(1,1)">+</button>
</div>
</div>


<div class="product">
<div>
<div class="name">Loaded Fries</div>
<div class="price">1 500 G</div>
</div>

<div class="actions">
<button class="remove" onclick="change(2,-1)">−</button>
<span class="qty" id="q2">0</span>
<button class="add" onclick="change(2,1)">+</button>
</div>
</div>


<div class="total">
<span>TOTAL</span>
<span id="total">0 G</span>
</div>

<select id="payment" class="payment">
<option>Cash</option>
<option>Carte</option>
<option>Autre</option>
</select>

<button class="mainbtn" onclick="pay()">
✓ ENREGISTRER & IMPRIMER — PAYÉ
</button>

<button class="mainbtn secondary" onclick="clearSale()">
Nouvelle vente
</button>

</section>


<section class="card">

<h2>Historique des reçus</h2>

<div id="history">
<div class="muted">Aucun reçu enregistré.</div>
</div>

</section>

</div>

<div class="receipt" id="receipt"></div>


<script>

const products=[
 ["Burger Ti Malice",1500],
 ["Frites",750],
 ["Loaded Fries",1500]
];

let cart=[0,0,0];


function money(n){
 return n.toLocaleString("fr-FR")+" G";
}


function change(i,d){
 cart[i]=Math.max(0,cart[i]+d);
 render();
}


function render(){

 cart.forEach((q,i)=>{
  document.getElementById("q"+i).textContent=q;
 });

 let total=cart.reduce(
  (s,q,i)=>s+q*products[i][1],0
 );

 document.getElementById("total").textContent=money(total);
}


function pay(){

 let total=cart.reduce(
  (s,q,i)=>s+q*products[i][1],0
 );

 if(!total){
  alert("Ajoutez au moins un produit.");
  return;
 }

 let history=JSON.parse(
  localStorage.getItem("tasty_history")||"[]"
 );

 let no=history.length
  ? history[0].no+1
  : 1;

 let now=new Date();

 let sale={
  no:no,
  date:now.toLocaleString("fr-FR"),
  items:cart.map((q,i)=>({
   name:products[i][0],
   qty:q,
   price:products[i][1]
  })).filter(x=>x.qty>0),
  total:total,
  payment:document.getElementById("payment").value
 };

 history.unshift(sale);

 localStorage.setItem(
  "tasty_history",
  JSON.stringify(history)
 );

 makeReceipt(sale);
 renderHistory();

 window.print();

 clearSale();
}


function makeReceipt(s){

 let rows=s.items.map(x=>
  `${x.qty} x ${x.name}
   ${money(x.qty*x.price)}`
 ).join("\n");

 document.getElementById("receipt").innerHTML=`

 <div style="text-align:center">

 <b>*** TASTY BITES ***</b><br>

 Catalpa #6<br>

 Gourdes haïtiennes<br>

 ------------------------------

 </div>

 Reçu N° ${String(s.no).padStart(5,"0")}<br>

 ${s.date}<br>

 ------------------------------<br>

 ${rows}<br>

 ------------------------------<br>

 <b>TOTAL : ${money(s.total)}</b><br>

 PAIEMENT : ${s.payment}<br>

 <b>STATUT : PAYÉ</b><br>

 <br>

 <div style="text-align:center">
 Merci et à bientôt !
 </div>

 `;
}


function renderHistory(){

 let h=JSON.parse(
  localStorage.getItem("tasty_history")||"[]"
 );

 if(!h.length){

  document.getElementById("history").innerHTML=
  '<div class="muted">Aucun reçu enregistré.</div>';

  return;
 }

 document.getElementById("history").innerHTML=

 h.slice(0,30).map(s=>`

 <div class="history-item">

 <b>Reçu #${String(s.no).padStart(5,"0")}</b>

 — ${money(s.total)}

 <br>

 <span class="muted">
 ${s.date} • ${s.payment} • PAYÉ
 </span>

 <br>

 <button
 class="add"
 style="margin-top:7px"
 onclick="reprint(${s.no})">

 Réimprimer

 </button>

 </div>

 `).join("");
}


function reprint(no){

 let h=JSON.parse(
  localStorage.getItem("tasty_history")||"[]"
 );

 let sale=h.find(x=>x.no===no);

 if(sale){

  makeReceipt(sale);

  window.print();
 }
}


function clearSale(){

 cart=[0,0,0];

 render();
}


render();
renderHistory();

</script>

</body>
</html>
