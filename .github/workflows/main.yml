name: Build Tasty Bites APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p www
          cp Index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "tasty-bites",
            "version": "1.0.0",
            "description": "Tasty Bites restaurant cashier",
            "scripts": {
              "build": "echo Build Tasty Bites"
            },
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1",
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF
          npm install
          npx cap init "Tasty Bites" "com.tastybites.caisse" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasty-Bites-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
